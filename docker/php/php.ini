; Brator — PHP settings for local development.

memory_limit = 512M
max_execution_time = 120

; Catalogue imports post large files; product images are uploaded from admin.
upload_max_filesize = 32M
post_max_size = 32M

; Show everything while developing — the whole point of a local env.
display_errors = On
error_reporting = E_ALL

; No reason to advertise the exact PHP build in every response header, even locally.
expose_php = Off

; opcache on, but revalidate every request so edits appear immediately.
; Production flips validate_timestamps off — see docker/php/php.prod.ini, which is a real
; file now rather than the intention this comment used to describe.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

date.timezone = Europe/Skopje
