; Brator — PHP settings for a hosted deployment.
;
; Selected at BUILD time by compose.prod.yaml, which passes PHP_INI=php.prod.ini. The
; development file is the default, so an ordinary `docker compose up` is unchanged.
;
; This file exists because display_errors was COPY'd into the image rather than driven by
; an environment variable. That meant a production build of the same image showed PHP's
; errors, file paths and arguments to visitors REGARDLESS of APP_DEBUG — the Laravel flag
; cannot switch off something PHP itself was told to print.

memory_limit = 512M
max_execution_time = 120

; Catalogue imports post large files; product images are uploaded from admin.
upload_max_filesize = 32M
post_max_size = 32M

; Never to the browser, always to the log. error_reporting stays at E_ALL: the goal is to
; keep recording everything, not to stop looking at it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Do not advertise the exact PHP build in every response header.
expose_php = Off

; The code does not change under a running container, so stop stat()-ing every file on
; every request. This is the single biggest cheap win on a small box — and it is also why
; a deploy here is `up -d --build`, not an edit in place.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

date.timezone = Europe/Skopje
