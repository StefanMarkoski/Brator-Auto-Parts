server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # The Brator theme's own assets, served straight off disk exactly as the theme
    # author shipped them. No bundler, no rewriting, no PHP in the path — this is
    # what keeps the styling byte-identical to the original template.
    location /assets/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Hand php-fpm ONLY paths that really are a script on disk. Without this, nginx
        # passes anything ending in .php — including /robots.txt/x.php, which PHP then
        # resolves itself via cgi.fix_pathinfo. Nothing can currently get a .php file into
        # the docroot (uploads are content-sniffed, and the URL importer takes its
        # extension from the decoded image type rather than the URL), so this is depth
        # rather than a live hole. It is one line and it removes the whole class.
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles (.env, .git) even if something lands in public/.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
    access_log /dev/stdout;
    error_log  /dev/stderr;
}
